name: Release desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-24.04
            bundles: deb,appimage
          - platform: macos-intel
            runs_on: macos-15-intel
            bundles: dmg
          - platform: macos-apple-silicon
            runs_on: macos-14
            bundles: dmg
          - platform: windows
            runs_on: windows-2022
            bundles: nsis
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl pkg-config \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-cli-2.9.4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-all-crates: true

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version '2.9.4' --locked

      - name: Build package
        working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }} --no-sign

      - name: Install appimagetool
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod a+rx "$RUNNER_TEMP/appimagetool"

      - name: Prepare release assets
        shell: bash
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/release-assets"

          case "${{ matrix.platform }}" in
            linux)
              appimage=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
              deb=$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
              test -n "$appimage"
              test -n "$deb"
              ./scripts/repair-appimage-permissions.sh \
                "$appimage" \
                "$RUNNER_TEMP/release-assets/Link-Helm_${version}_amd64.AppImage"
              cp "$deb" "$RUNNER_TEMP/release-assets/Link-Helm_${version}_Linux_amd64.deb"
              ;;
            macos-intel)
              dmg=$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
              test -n "$dmg"
              cp "$dmg" "$RUNNER_TEMP/release-assets/Link-Helm_${version}_macOS_Intel.dmg"
              ;;
            macos-apple-silicon)
              dmg=$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
              test -n "$dmg"
              cp "$dmg" "$RUNNER_TEMP/release-assets/Link-Helm_${version}_macOS_Apple-Silicon.dmg"
              ;;
            windows)
              installer=$(find target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -print -quit)
              test -n "$installer"
              cp "$installer" "$RUNNER_TEMP/release-assets/Link-Helm_${version}_Windows_x64-setup.exe"
              ;;
          esac

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ runner.temp }}/release-assets/*
