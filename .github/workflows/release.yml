name: Release desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (must already exist)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Tag matches app version
        shell: bash
        run: |
          app_version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "v${app_version}" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match tauri.conf.json version ${app_version}"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # The desktop shell needs WebKitGTK system packages; it is compiled by
      # every platform build below, so verify only tests the shared crates.
      - name: Test
        run: cargo test --locked --workspace --exclude link-helm-desktop

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-24.04
            bundles: deb,appimage
          - platform: macos-intel
            runs_on: macos-15-intel
            bundles: dmg
          - platform: macos-apple-silicon
            runs_on: macos-15
            bundles: dmg
          - platform: windows
            runs_on: windows-2022
            bundles: nsis
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          # The runner's default mirror (us-east-2.ec2.archive.ubuntu.com) has
          # stalled for 10+ minutes. Prefer the main archive; keep the default
          # as a fallback.
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            { echo "http://archive.ubuntu.com/ubuntu/	priority:1"; cat "$mirrors"; } | sudo tee "$mirrors.new" >/dev/null
            sudo mv "$mirrors.new" "$mirrors"
            cat "$mirrors"
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y build-essential curl pkg-config \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-cli-2.9.4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-all-crates: true

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version '2.9.4' --locked

      - name: Build package
        working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }} --no-sign -- --locked

      - name: Install appimagetool
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod a+rx "$RUNNER_TEMP/appimagetool"

      # Asset names carry no version so README/site links can use
      # releases/latest/download/<name> and never need editing per release.
      - name: Prepare release assets
        shell: bash
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: |
          out="$RUNNER_TEMP/release-assets"
          mkdir -p "$out"

          case "${{ matrix.platform }}" in
            linux)
              appimage=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
              deb=$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
              test -n "$appimage"
              test -n "$deb"
              ./scripts/repair-appimage-permissions.sh "$appimage" "$out/Link-Helm_amd64.AppImage"
              cp "$deb" "$out/Link-Helm_Linux_amd64.deb"
              ;;
            macos-intel)
              dmg=$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
              test -n "$dmg"
              cp "$dmg" "$out/Link-Helm_macOS_Intel.dmg"
              ;;
            macos-apple-silicon)
              dmg=$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
              test -n "$dmg"
              cp "$dmg" "$out/Link-Helm_macOS_Apple-Silicon.dmg"
              ;;
            windows)
              installer=$(find target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -print -quit)
              test -n "$installer"
              cp "$installer" "$out/Link-Helm_Windows_x64-setup.exe"
              ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  # One job publishes everything, so parallel builds never race to create
  # the release.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
